name: Release

# Creates a release from the notes in CHANGELOG.md, of one of two kinds:
# - integration: a normal release vX.Y.Z with the signed APK and the
#   integration as ZIP; HACS offers it as an update.
# - app: a pre-release app-vX.Y.Z with the APK only; HACS ignores
#   pre-releases, the app's stable channel installs it.
# "auto" makes an integration release only if custom_components/ changed
# since the last one (the version in manifest.json aside). Runs for a
# pushed tag vX.Y.Z (integration), or manually: then the version comes from
# the files and the tag is created on the selected commit.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      kind:
        description: "auto, integration (vX.Y.Z, HACS) or app (app-vX.Y.Z pre-release)"
        type: choice
        options: [auto, integration, app]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # History and tags: what changed since the last integration release.
          fetch-depth: 0

      - name: Check that the tag matches all versions
        id: version
        run: |
          APP=$(grep '^version:' app/pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="$APP"
            for t in "v$TAG" "app-v$TAG"; do
              if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then
                echo "::error::Release $t already exists. Bump the version first."
                exit 1
              fi
            done
          fi
          INTEGRATION=$(python3 -c "import json;print(json.load(open('custom_components/even_g1/manifest.json'))['version'])")
          CHANGELOG=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "tag=$TAG app=$APP integration=$INTEGRATION changelog=$CHANGELOG"
          if [ "$TAG" != "$APP" ] || [ "$TAG" != "$INTEGRATION" ] || [ "$TAG" != "$CHANGELOG" ]; then
            echo "::error::Tag v$TAG does not match app ($APP), integration ($INTEGRATION) and CHANGELOG ($CHANGELOG)."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Integration or app release
        id: kind
        env:
          KIND: ${{ inputs.kind || 'integration' }}
        run: |
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ "$KIND" = "auto" ]; then
            # The integration without the version line of its manifest.
            if [ -z "$LAST" ] || ! git diff --quiet "$LAST" HEAD -- custom_components \
                ':(exclude)custom_components/even_g1/manifest.json' \
              || git diff "$LAST" HEAD -- custom_components/even_g1/manifest.json \
                | grep '^[-+] ' | grep -vq '"version"'; then
              KIND=integration
            else
              KIND=app
            fi
          fi
          echo "Last integration release: ${LAST:-none}; this one: $KIND"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ "${{ steps.kind.outputs.kind }}" = "app" ]; then
            cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ---
          **App only.** The Home Assistant integration is unchanged since ${{ steps.kind.outputs.last }} (this is a pre-release, so HACS offers no update). Install \`even-g1-ha-*.apk\` on the phone, or let the app update itself.
          EOF
          else
            cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ---
          **Installation:** install `even-g1-ha-*.apk` on the Android phone (it installs over the previous version). Update the integration with HACS or unpack `even_g1-*.zip` to `config/custom_components/even_g1/`.
          EOF
          fi
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle and its downloads from the cache, so a GitHub download
          # outage does not break the build.
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Releases must be signed with the fixed key, otherwise they cannot
          # be installed as updates.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          if [ -z "$CLEAN" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks"
          PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASSWORD" -alias even-g1-ha | grep -i "SHA-256"
          echo "::add-mask::$PASSWORD"
          echo "G1_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "G1_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "G1_KEY_ALIAS=even-g1-ha" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter test
          # Build number = minutes since 1970: every newer build of any
          # channel (stable or preview) has a higher one, so Android
          # accepts it as an update.
          flutter build apk --release --build-number=$(( $(date +%s) / 60 ))

      - name: Package assets
        run: |
          V="${{ steps.version.outputs.version }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "even-g1-ha-v$V.apk"
          (cd custom_components/even_g1 && zip -r "$GITHUB_WORKSPACE/even_g1-v$V.zip" . -x '__pycache__/*')

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          # Remove the former rolling pre-release (replaced by versioned releases).
          gh release delete app-latest --cleanup-tag --yes 2>/dev/null || true
          if [ "${{ steps.kind.outputs.kind }}" = "app" ]; then
            cp "even-g1-ha-v$V.apk" "even-g1-ha-app-v$V.apk"
            gh release create "app-v$V" "even-g1-ha-app-v$V.apk" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "App v$V" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "v$V" "even-g1-ha-v$V.apk" "even_g1-v$V.zip" \
              --target "$GITHUB_SHA" \
              --title "v$V" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
