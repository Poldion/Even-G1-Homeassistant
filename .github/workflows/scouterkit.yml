name: Preview build

# Builds the app on every push to main and publishes it as a pre-release
# sk-vX.Y.Z.N (X.Y.Z from pubspec.yaml, N the run number; the prefix dates
# from the ScouterKit builds). The app's "Vorabversion" update channel
# installs these; the stable channel and releases/latest never see them.
# Signed with the release key, so it installs over the stable app and back.
# Only changes to what goes into the APK make a new build: tests, docs and
# the rest of the repository do not (the App workflow still tests them).
on:
  push:
    branches: ["main"]
    paths:
      - "app/lib/**"
      - "app/assets/**"
      - "app/android/**"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - ".github/workflows/scouterkit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scouterkit-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Must be the release key, otherwise the APK does not install as
          # an update of the stable app.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          if [ -z "$CLEAN" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks"
          PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASSWORD" -alias even-g1-ha | grep -i "SHA-256"
          echo "::add-mask::$PASSWORD"
          echo "G1_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "G1_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "G1_KEY_ALIAS=even-g1-ha" >> "$GITHUB_ENV"

      - name: Test and build APK
        working-directory: app
        run: |
          BASE=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          V="$BASE.$GITHUB_RUN_NUMBER"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          flutter pub get
          flutter analyze
          flutter test
          # Build number = minutes since 1970, as in release.yml.
          flutter build apk --release --build-name="$V" --build-number=$(( $(date +%s) / 60 ))

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$VERSION"
          cp app/build/app/outputs/flutter-apk/app-release.apk "even-g1-ha-sk-v$V.apk"
          {
            echo "Vorabversion von main, Stand ${GITHUB_SHA::7}."
            echo
            awk '/^## \[Unreleased\]/{f=1; next} f && /^## \[/{exit} f{print}' CHANGELOG.md
            echo
            echo "---"
            echo "**Installation:** über den Update-Kanal „Vorabversion“ in der App (Einstellungen → Updates)."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "sk-v$V" "even-g1-ha-sk-v$V.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Vorabversion v$V" \
            --notes-file "$RUNNER_TEMP/notes.md"
          # Keep the three newest pre-releases.
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("sk-v"))) | .tagName' \
            | tail -n +4 \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
