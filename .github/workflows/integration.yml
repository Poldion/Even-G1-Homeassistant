name: Integration

on:
  push:
    paths: ["custom_components/**", "tests/**", "scripts/**", "requirements_test.txt", ".github/workflows/integration.yml", "hacs.json"]
  pull_request:
    paths: ["custom_components/**", "tests/**", "scripts/**", "requirements_test.txt", ".github/workflows/integration.yml", "hacs.json"]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest supported HA
            python: "3.13"
            requirements: -r requirements_test.txt
          - name: latest HA
            python: "3.14"
            requirements: pytest-homeassistant-custom-component
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.requirements }} ruff
      - run: python scripts/install_ha_test_requirements.py
      - run: python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Repository settings (description, topics) and the license must be set on GitHub.
          ignore: brands description topics license
