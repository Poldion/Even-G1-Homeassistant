name: App

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Both languages complete (CLAUDE.md)
        run: |
          flutter gen-l10n
          if [ -s build/untranslated_messages.json ] && [ "$(tr -d ' \n' < build/untranslated_messages.json)" != "{}" ]; then
            echo "::error::Untranslated messages:"; cat build/untranslated_messages.json; exit 1
          fi
          git diff --exit-code -- lib/l10n/gen || { echo "::error::Run flutter gen-l10n and commit lib/l10n/gen."; exit 1; }
      - run: flutter analyze
      - run: flutter test
      - name: Test LC3 decoder (host build)
        working-directory: app/packages/lc3_codec
        run: |
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          flutter pub get
          LC3_CODEC_LIBRARY=$PWD/build/liblc3_codec.so flutter test
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a temporary debug key and cannot be installed as an update."
            exit 0
          fi
          # Tolerate line breaks and spaces from copying the secret.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          # Length only, the value itself stays secret (expected: 5720).
          echo "ANDROID_KEYSTORE_BASE64: ${#CLEAN} characters"
          if printf '%s' "$CLEAN" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::ANDROID_KEYSTORE_BASE64 contains characters that are not Base64 (extra text copied?)."
            exit 1
          fi
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64 (incomplete copy?)."
            exit 1
          }
          PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          # Check the key and print its public fingerprint (expected for this
          # project: SHA-256 90:87:D5:A1:...:A1:49:A1).
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASSWORD" -alias even-g1-ha \
            | grep -i "SHA-256" || {
            echo "::error::Keystore cannot be opened: wrong ANDROID_KEYSTORE_PASSWORD or incomplete ANDROID_KEYSTORE_BASE64."
            exit 1
          }
          echo "::add-mask::$PASSWORD"
          echo "G1_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "G1_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "G1_KEY_ALIAS=even-g1-ha" >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: even-g1-ha-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
