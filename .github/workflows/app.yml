name: App

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/app.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test LC3 decoder (host build)
        working-directory: app/packages/lc3_codec
        run: |
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          flutter pub get
          LC3_CODEC_LIBRARY=$PWD/build/liblc3_codec.so flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: even-g1-ha-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
