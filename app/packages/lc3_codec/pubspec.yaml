name: lc3_codec
description: "LC3 decoder (google/liblc3) for the Even G1 microphone stream."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
